<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Payment | Tina's Bite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="menu.html" class="text-amber-400 hover:text-amber-300 font-bold text-sm flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Menu
      </a>
      <h1 class="font-black text-lg text-amber-400 tracking-wide">TINA'S BITE CHECKOUT</h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    <form id="checkout-form" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Left Column: Customer & Delivery Details -->
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-5">
        <h2 class="text-lg font-bold text-amber-400 border-b border-gray-800 pb-3">1. Delivery Details</h2>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Full Name</label>
          <input type="text" id="cust-name" required placeholder="e.g. Kwame Mensah" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Phone Number (WhatsApp / MoMo)</label>
          <input type="tel" id="cust-phone" required placeholder="e.g. 0551234567" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Delivery Zone (Ada / Sege)</label>
          <select id="cust-zone" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
            <option value="1" data-fee="15.00">Sege Central (GH₵ 15.00)</option>
            <option value="2" data-fee="18.00">Kasseh (GH₵ 18.00)</option>
            <option value="3" data-fee="20.00">Ada Foah (GH₵ 20.00)</option>
            <option value="4" data-fee="25.00">Big Ada / Surrounding Areas (GH₵ 25.00)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Exact Landmark / House Direction</label>
          <textarea id="cust-address" rows="2" required placeholder="e.g. Opposite Sege Police Station, yellow gate" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400"></textarea>
        </div>
      </div>

      <!-- Right Column: Order Summary & MoMo Payment -->
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl flex flex-col justify-between space-y-6">
        <div>
          <h2 class="text-lg font-bold text-amber-400 border-b border-gray-800 pb-3 mb-4">2. Order & Payment</h2>

          <div id="checkout-items" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>

          <div class="bg-gray-800/50 p-4 rounded-xl space-y-2 text-sm">
            <div class="flex justify-between text-gray-400">
              <span>Items Subtotal:</span>
              <span id="summary-items-total" class="text-white font-semibold">GH₵ 0.00</span>
            </div>
            <div class="flex justify-between text-gray-400">
              <span>Delivery Fee:</span>
              <span id="summary-delivery-fee" class="text-white font-semibold">GH₵ 15.00</span>
            </div>
            <div class="flex justify-between text-base font-black text-amber-400 border-t border-gray-700 pt-2 mt-2">
              <span>Grand Total:</span>
              <span id="summary-grand-total">GH₵ 0.00</span>
            </div>
          </div>

          <div class="mt-5">
            <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Mobile Money Network</label>
            <select id="pay-provider" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
              <option value="MTN Mobile Money">MTN Mobile Money</option>
              <option value="Telecel Cash">Telecel Cash</option>
              <option value="AirtelTigo Money">AirtelTigo Money</option>
            </select>
          </div>

          <div class="mt-4 bg-amber-400/10 border border-amber-400/30 rounded-xl p-3 text-xs text-amber-200">
            <p class="font-bold text-amber-400 mb-1"><i class="fa-solid fa-mobile-screen-button mr-1"></i> Direct MoMo Transfer</p>
            Send exact total to <strong>0551011153</strong> (Tina's Bite) and click below to log your order and send receipt via WhatsApp.
          </div>
        </div>

        <button type="submit" id="submit-order-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-gray-950 font-black py-4 rounded-xl shadow-lg transition text-sm uppercase tracking-wider">
          Confirm Order & Send to WhatsApp
        </button>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
